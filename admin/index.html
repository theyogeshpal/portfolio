<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Yogesh Pal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Roboto Mono', monospace; }</style>
</head>
<body class="bg-[#0a0a0a] min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="../index.html" class="text-2xl font-bold"><span class="text-orange-500">Yogesh</span><span class="text-white">Pal</span></a>
            <p class="text-gray-500 text-sm mt-2">Admin Panel</p>
        </div>
        <div class="bg-[#111] border border-gray-800 rounded-2xl p-8">
            <h1 class="text-white text-xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="lock" class="w-5 h-5 text-orange-500"></i> Admin Login
            </h1>
            <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-3 rounded-xl mb-4"></div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Username</label>
                    <input type="text" id="username" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition-colors" placeholder="Enter username">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="password" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition-colors pr-12" placeholder="Enter password">
                        <button type="button" onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                            <i data-lucide="eye" id="eye-icon" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-orange-700 text-white font-bold py-3 rounded-xl hover:shadow-lg hover:shadow-orange-500/20 transition-all flex items-center justify-center gap-2">
                    <span id="btn-text">Login</span>
                    <i data-lucide="loader-2" id="btn-loader" class="w-4 h-4 hidden animate-spin"></i>
                </button>
            </form>
        </div>
    </div>
    <script>
        const API = 'http://theyogeshpal.runasp.net';
        lucide.createIcons();

        if (sessionStorage.getItem('admin_token')) window.location.href = 'dashboard.html';

        function togglePass() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
            document.getElementById('eye-icon').setAttribute('data-lucide', p.type === 'password' ? 'eye' : 'eye-off');
            lucide.createIcons();
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errEl = document.getElementById('error-msg');
            document.getElementById('btn-text').textContent = 'Logging in...';
            document.getElementById('btn-loader').classList.remove('hidden');
            errEl.classList.add('hidden');
            try {
                const res = await fetch(`${API}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    sessionStorage.setItem('admin_token', data.token || data.Token || 'authenticated');
                    window.location.href = 'dashboard.html';
                } else {
                    errEl.textContent = data.message || data.Message || 'Invalid credentials.';
                    errEl.classList.remove('hidden');
                }
            } catch {
                errEl.textContent = 'Server error. Please try again.';
                errEl.classList.remove('hidden');
            } finally {
                document.getElementById('btn-text').textContent = 'Login';
                document.getElementById('btn-loader').classList.add('hidden');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Yogesh Pal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto Mono', monospace; }
        .tab-active { background: linear-gradient(to right, #f97316, #c2410c); color: white; }
    </style>
</head>
<body class="bg-[#0a0a0a] min-h-screen text-white">

    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 h-full w-60 bg-[#111] border-r border-gray-800 flex flex-col z-40">
        <div class="p-6 border-b border-gray-800">
            <a href="../index.html" class="text-xl font-bold"><span class="text-orange-500">Yogesh</span>Pal</a>
            <p class="text-gray-500 text-xs mt-1">Admin Panel</p>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <button onclick="showTab('all')" id="tab-all" class="tab-btn tab-active w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3 transition-all">
                <i data-lucide="message-square" class="w-4 h-4"></i> All Testimonials
            </button>
            <button onclick="showTab('approved')" id="tab-approved" class="tab-btn w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3 text-gray-400 hover:text-white hover:bg-[#1a1a1a] transition-all">
                <i data-lucide="check-circle" class="w-4 h-4"></i> Approved
            </button>
        </nav>
        <div class="p-4 border-t border-gray-800">
            <button onclick="logout()" class="w-full text-left px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-3 text-gray-400 hover:text-red-400 hover:bg-red-500/10 transition-all">
                <i data-lucide="log-out" class="w-4 h-4"></i> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-60 p-8">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 id="page-title" class="text-2xl font-bold">All Testimonials</h1>
                <p class="text-gray-500 text-sm mt-1">Manage testimonials from your visitors</p>
            </div>
            <div id="stats" class="flex gap-4"></div>
        </div>

        <!-- Toast -->
        <div id="toast" class="fixed top-6 right-6 z-50 hidden px-5 py-3 rounded-xl text-sm font-semibold shadow-xl transition-all"></div>

        <!-- Content -->
        <div id="tab-all-content">
            <div id="all-loading" class="flex items-center gap-3 text-gray-500 py-12 justify-center">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Loading testimonials...
            </div>
            <div id="all-list" class="grid gap-4 hidden"></div>
            <div id="all-empty" class="hidden text-center py-16 text-gray-600">
                <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                <p>No testimonials yet.</p>
            </div>
        </div>

        <div id="tab-approved-content" class="hidden">
            <div id="approved-loading" class="flex items-center gap-3 text-gray-500 py-12 justify-center">
                <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Loading approved testimonials...
            </div>
            <div id="approved-list" class="grid gap-4 hidden"></div>
            <div id="approved-empty" class="hidden text-center py-16 text-gray-600">
                <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
                <p>No approved testimonials.</p>
            </div>
        </div>
    </main>

    <script>
        const API = 'http://theyogeshpal.runasp.net';
        const token = sessionStorage.getItem('admin_token');
        if (!token) window.location.href = 'index.html';

        lucide.createIcons();

        function logout() {
            sessionStorage.removeItem('admin_token');
            window.location.href = 'index.html';
        }

        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `fixed top-6 right-6 z-50 px-5 py-3 rounded-xl text-sm font-semibold shadow-xl ${type === 'success' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function starRating(rating) {
            return Array.from({length: 5}, (_, i) =>
                `<span class="${i < rating ? 'text-orange-400' : 'text-gray-700'}">★</span>`
            ).join('');
        }

        function renderCard(t, showApprove = true) {
            const isApproved = t.isApproved || t.IsApproved;
            const id = t.id || t.Id;
            return `
            <div id="card-${id}" class="bg-[#111] border border-gray-800 rounded-2xl p-6 hover:border-gray-700 transition-all">
                <div class="flex items-start justify-between gap-4 mb-3">
                    <div>
                        <h3 class="font-bold text-white">${t.name || t.Name || 'Anonymous'}</h3>
                        <p class="text-gray-500 text-xs">${t.designation || t.Designation || ''} ${t.company || t.Company ? '@ ' + (t.company || t.Company) : ''}</p>
                    </div>
                    <span class="text-xs px-2.5 py-1 rounded-full font-semibold flex-shrink-0 ${isApproved ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-yellow-500/10 text-yellow-400 border border-yellow-500/20'}">
                        ${isApproved ? 'Approved' : 'Pending'}
                    </span>
                </div>
                <div class="text-sm mb-3">${starRating(t.rating || t.Rating || 5)}</div>
                <p class="text-gray-400 text-sm leading-relaxed mb-4">"${t.message || t.Message || t.review || t.Review || ''}"</p>
                <div class="flex gap-2">
                    ${showApprove && !isApproved ? `<button onclick="approve(${id})" class="flex items-center gap-1.5 px-4 py-2 bg-green-500/10 text-green-400 border border-green-500/20 rounded-xl text-xs font-semibold hover:bg-green-500 hover:text-white transition-all"><i data-lucide="check" class="w-3.5 h-3.5"></i> Approve</button>` : ''}
                    <button onclick="deleteT(${id})" class="flex items-center gap-1.5 px-4 py-2 bg-red-500/10 text-red-400 border border-red-500/20 rounded-xl text-xs font-semibold hover:bg-red-500 hover:text-white transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Delete</button>
                </div>
            </div>`;
        }

        async function loadAll() {
            try {
                const res = await fetch(`${API}/testimonial`, { headers: { Authorization: `Bearer ${token}` } });
                const data = await res.json();
                const list = Array.isArray(data) ? data : (data.data || data.Data || []);
                document.getElementById('all-loading').classList.add('hidden');
                if (!list.length) { document.getElementById('all-empty').classList.remove('hidden'); return; }
                const el = document.getElementById('all-list');
                el.innerHTML = list.map(t => renderCard(t, true)).join('');
                el.classList.remove('hidden');
                lucide.createIcons();
                const approved = list.filter(t => t.isApproved || t.IsApproved).length;
                document.getElementById('stats').innerHTML = `
                    <div class="bg-[#111] border border-gray-800 rounded-xl px-4 py-2 text-center"><p class="text-orange-500 font-bold text-lg">${list.length}</p><p class="text-gray-500 text-xs">Total</p></div>
                    <div class="bg-[#111] border border-gray-800 rounded-xl px-4 py-2 text-center"><p class="text-green-400 font-bold text-lg">${approved}</p><p class="text-gray-500 text-xs">Approved</p></div>
                    <div class="bg-[#111] border border-gray-800 rounded-xl px-4 py-2 text-center"><p class="text-yellow-400 font-bold text-lg">${list.length - approved}</p><p class="text-gray-500 text-xs">Pending</p></div>`;
            } catch {
                document.getElementById('all-loading').innerHTML = '<p class="text-red-400">Failed to load testimonials.</p>';
            }
        }

        async function loadApproved() {
            try {
                const res = await fetch(`${API}/approved-testimonial`);
                const data = await res.json();
                const list = Array.isArray(data) ? data : (data.data || data.Data || []);
                document.getElementById('approved-loading').classList.add('hidden');
                if (!list.length) { document.getElementById('approved-empty').classList.remove('hidden'); return; }
                const el = document.getElementById('approved-list');
                el.innerHTML = list.map(t => renderCard(t, false)).join('');
                el.classList.remove('hidden');
                lucide.createIcons();
            } catch {
                document.getElementById('approved-loading').innerHTML = '<p class="text-red-400">Failed to load.</p>';
            }
        }

        async function approve(id) {
            try {
                const res = await fetch(`${API}/approve/${id}`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
                if (res.ok) { showToast('Testimonial approved!'); loadAll(); }
                else showToast('Failed to approve.', 'error');
            } catch { showToast('Server error.', 'error'); }
        }

        async function deleteT(id) {
            if (!confirm('Delete this testimonial?')) return;
            try {
                const res = await fetch(`${API}/delete/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
                if (res.ok) {
                    document.getElementById(`card-${id}`)?.remove();
                    showToast('Deleted successfully!');
                } else showToast('Failed to delete.', 'error');
            } catch { showToast('Server error.', 'error'); }
        }

        let approvedLoaded = false;
        function showTab(tab) {
            ['all', 'approved'].forEach(t => {
                document.getElementById(`tab-${t}-content`).classList.toggle('hidden', t !== tab);
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.toggle('tab-active', t === tab);
                btn.classList.toggle('text-gray-400', t !== tab);
                btn.classList.toggle('hover:text-white', t !== tab);
                btn.classList.toggle('hover:bg-[#1a1a1a]', t !== tab);
            });
            document.getElementById('page-title').textContent = tab === 'all' ? 'All Testimonials' : 'Approved Testimonials';
            if (tab === 'approved' && !approvedLoaded) { loadApproved(); approvedLoaded = true; }
        }

        loadAll();
    </script>
</body>
</html>

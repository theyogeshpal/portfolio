<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experience Details - Yogesh Pal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased selection:bg-orange-500 selection:text-white">

    <!-- Navbar -->
    <nav class="fixed w-full bg-white/90 backdrop-blur-md z-50 shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex items-center gap-2 group">
                    <div class="w-10 h-10 bg-gradient-to-br from-orange-500 to-orange-700 rounded-xl flex items-center justify-center text-white font-bold text-xl group-hover:scale-105 transition-transform shadow-lg shadow-orange-500/30">
                        Y
                    </div>
                    <span class="font-bold text-xl tracking-tight text-gray-900 group-hover:text-orange-600 transition-colors">Yogesh Pal</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-orange-600 font-semibold transition-colors flex items-center gap-1"><i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Portfolio</a>
                </div>
                <div class="md:hidden">
                    <a href="index.html" class="text-gray-900 p-2"><i data-lucide="arrow-left"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="pt-32 pb-20 min-h-screen flex flex-col">
        <div class="max-w-4xl mx-auto px-4 w-full flex-grow">
            
            <div id="exp-container" class="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden hidden">
                <div class="h-48 md:h-64 bg-gradient-to-br from-gray-800 to-gray-900 relative flex items-center justify-center overflow-hidden">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                    <div id="e-company-logo-container" class="relative z-10 bg-white p-4 rounded-2xl border-4 border-white/10 shadow-2xl hidden">
                        <img id="e-company-logo" src="" alt="Company Logo" class="w-24 h-24 md:w-32 md:h-32 object-contain mix-blend-multiply">
                    </div>
                    <i id="e-company-icon" data-lucide="building-2" class="w-24 h-24 text-white/50 relative z-10"></i>
                </div>
                
                <div class="p-8 md:p-12 relative">
                    <!-- Floating Date Badge -->
                    <div class="md:absolute md:top-12 md:right-12 mb-6 md:mb-0">
                        <span id="e-duration" class="bg-orange-100 text-orange-700 font-bold px-4 py-2 rounded-full border border-orange-200">2025 - Present</span>
                    </div>

                    <h1 id="e-title" class="text-4xl md:text-5xl font-bold text-gray-900 mb-2">Job Title</h1>
                    <div class="flex items-center gap-2 text-gray-500 mb-8">
                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                        <span id="e-company" class="font-medium text-lg">Company Name</span>
                        <span class="mx-2">•</span>
                        <span id="e-location">Location</span>
                    </div>
                    
                    <div class="mb-10">
                        <h3 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-3">Technologies Used</h3>
                        <div id="e-tech" class="flex flex-wrap gap-2">
                            <!-- Tech stack will be injected here -->
                        </div>
                    </div>
                    
                    <div class="prose max-w-none text-gray-600 text-lg leading-relaxed mb-10">
                        <h3 class="text-2xl font-bold text-gray-900 mb-4">Overview</h3>
                        <p id="e-description" class="mb-6">Description</p>
                        
                        <div id="e-image-container" class="my-8 rounded-2xl overflow-hidden shadow-xl border-4 border-white bg-gray-100 hidden">
                            <img id="e-image" src="" alt="Experience Image" class="w-full h-auto max-h-[600px] object-cover hover:scale-105 transition-transform duration-700">
                        </div>
                        
                        <h3 class="text-2xl font-bold text-gray-900 mb-4 mt-8">Key Responsibilities & Achievements</h3>
                        <ul id="e-details" class="list-disc pl-6 space-y-3 marker:text-orange-500">
                            <!-- Details injected here -->
                        </ul>
                    </div>
                    
                    <div class="pt-6 border-t border-gray-100">
                        <a href="index.html#experience" class="inline-flex items-center gap-2 text-orange-600 font-semibold hover:text-orange-700 transition-colors">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                            Back to Experiences
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-950 text-gray-400 py-12 text-center border-t border-gray-900 mt-auto">
        <div class="max-w-7xl mx-auto px-4">
            <p>Made with ❤️ by Yogesh Pal. &copy; <span id="year"></span> All rights reserved.</p>
        </div>
    </footer>

    <!-- Load Data and Script -->
    <script src="data.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        
        const exp = portfolioData.experience;
        
        if (exp) {
            document.getElementById('exp-container').classList.remove('hidden');
            
            document.getElementById('e-title').textContent = exp.title;
            document.getElementById('e-company').textContent = exp.company;
            document.getElementById('e-location').textContent = exp.location;
            document.getElementById('e-duration').textContent = exp.duration;
            document.getElementById('e-description').textContent = exp.description;
            
            if (exp.image) {
                const imgContainer = document.getElementById('e-image-container');
                const img = document.getElementById('e-image');
                img.src = exp.image;
                imgContainer.classList.remove('hidden');
            }
            
            if (exp.companyLogo) {
                const logoContainer = document.getElementById('e-company-logo-container');
                const logo = document.getElementById('e-company-logo');
                const icon = document.getElementById('e-company-icon');
                logo.src = exp.companyLogo;
                logoContainer.classList.remove('hidden');
                logoContainer.classList.add('flex');
                if (icon) icon.classList.add('hidden');
            }
            
            // Set Tech Stack
            const techContainer = document.getElementById('e-tech');
            exp.techStack.forEach(tech => {
                const span = document.createElement('span');
                span.className = 'font-semibold bg-gray-100 text-gray-700 border border-gray-200 px-3 py-1 rounded-md text-sm';
                span.textContent = tech;
                techContainer.appendChild(span);
            });

            // Set Details
            const detailsContainer = document.getElementById('e-details');
            exp.details.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                detailsContainer.appendChild(li);
            });
            
            // Initialize Lucide Icons
            lucide.createIcons();
        }
    </script>
</body>
</html>

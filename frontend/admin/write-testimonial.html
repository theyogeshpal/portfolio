<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write a Review | Yogesh Pal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto Mono', monospace; }
        .star { cursor: pointer; font-size: 2rem; color: #374151; transition: color 0.15s; }
        .star.active { color: #f97316; }
    </style>
</head>
<body class="bg-[#0a0a0a] min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg">
        <div class="text-center mb-8">
            <a href="../../index.html" class="text-2xl font-bold"><span class="text-orange-500">Yogesh</span><span class="text-white">Pal</span></a>
            <p class="text-gray-500 text-sm mt-2">Share your experience</p>
        </div>

        <!-- Success State -->
        <div id="success-state" class="hidden bg-[#111] border border-gray-800 rounded-2xl p-10 text-center">
            <div class="w-16 h-16 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="check-circle" class="w-8 h-8 text-green-400"></i>
            </div>
            <h2 class="text-white text-xl font-bold mb-2">Thank you!</h2>
            <p class="text-gray-400 text-sm mb-6">Your review has been submitted and is pending approval.</p>
            <a href="../../index.html" class="inline-flex items-center gap-2 bg-gradient-to-r from-orange-500 to-orange-700 text-white font-semibold px-6 py-2.5 rounded-xl text-sm hover:shadow-lg hover:shadow-orange-500/20 transition-all">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Portfolio
            </a>
        </div>

        <!-- Form -->
        <div id="form-state" class="bg-[#111] border border-gray-800 rounded-2xl p-8">
            <h1 class="text-white text-xl font-bold mb-6 flex items-center gap-2">
                <i data-lucide="star" class="w-5 h-5 text-orange-500"></i> Write a Review
            </h1>
            <div id="error-msg" class="hidden bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-4 py-3 rounded-xl mb-4"></div>
            <form id="review-form" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Your Name *</label>
                        <input type="text" id="name" required class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition-colors text-sm" placeholder="John Doe">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-2">Designation</label>
                        <input type="text" id="designation" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition-colors text-sm" placeholder="CEO, Developer...">
                    </div>
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Company / Organization</label>
                    <input type="text" id="company" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition-colors text-sm" placeholder="Your company name">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Rating *</label>
                    <div id="stars" class="flex gap-1">
                        <span class="star" data-val="1">★</span>
                        <span class="star" data-val="2">★</span>
                        <span class="star" data-val="3">★</span>
                        <span class="star" data-val="4">★</span>
                        <span class="star" data-val="5">★</span>
                    </div>
                    <input type="hidden" id="rating" value="0">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-2">Your Review *</label>
                    <textarea id="message" required rows="4" class="w-full bg-[#1a1a1a] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-orange-500 transition-colors text-sm resize-none" placeholder="Share your experience working with Yogesh..."></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-orange-700 text-white font-bold py-3 rounded-xl hover:shadow-lg hover:shadow-orange-500/20 transition-all flex items-center justify-center gap-2 text-sm">
                    <span id="btn-text">Submit Review</span>
                    <i data-lucide="loader-2" id="btn-loader" class="w-4 h-4 hidden animate-spin"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        const API = 'https://theyogeshpal.runasp.net';
        lucide.createIcons();

        // Star rating
        let selectedRating = 0;
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('mouseover', () => highlightStars(+star.dataset.val));
            star.addEventListener('mouseout', () => highlightStars(selectedRating));
            star.addEventListener('click', () => {
                selectedRating = +star.dataset.val;
                document.getElementById('rating').value = selectedRating;
                highlightStars(selectedRating);
            });
        });
        function highlightStars(val) {
            document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', +s.dataset.val <= val));
        }

        document.getElementById('review-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errEl = document.getElementById('error-msg');
            const rating = +document.getElementById('rating').value;
            if (!rating) { errEl.textContent = 'Please select a rating.'; errEl.classList.remove('hidden'); return; }

            document.getElementById('btn-text').textContent = 'Submitting...';
            document.getElementById('btn-loader').classList.remove('hidden');
            errEl.classList.add('hidden');

            const payload = {
                name: document.getElementById('name').value.trim(),
                designation: document.getElementById('designation').value.trim(),
                company: document.getElementById('company').value.trim(),
                message: document.getElementById('message').value.trim(),
                rating
            };

            try {
                const res = await fetch(`${API}/write-testimonial`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    document.getElementById('form-state').classList.add('hidden');
                    document.getElementById('success-state').classList.remove('hidden');
                    lucide.createIcons();
                } else {
                    const data = await res.json();
                    errEl.textContent = data.message || data.Message || 'Submission failed.';
                    errEl.classList.remove('hidden');
                }
            } catch {
                errEl.textContent = 'Server error. Please try again.';
                errEl.classList.remove('hidden');
            } finally {
                document.getElementById('btn-text').textContent = 'Submit Review';
                document.getElementById('btn-loader').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
